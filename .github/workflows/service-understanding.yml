name: Service understanding multi-model pilot
on:
  push:
    branches: ['experiment/service-understanding-next-20261001']
    paths: ['experiments/service-understanding/**', '.github/workflows/service-understanding.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: qwen3:4b-instruct
            label: qwen
          - model: gemma3:1b
            label: gemma
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: 1
      ONE_URL: http://127.0.0.1:8080
      ACLAB_BLAZE_WORKER: ${{ github.workspace }}/experiments/hosted-sourcemeta/build/bin/jh_blaze_worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python and freeze host
        run: |
          mkdir -p results/service-understanding
          pip install -e '.[dev]'
          pip freeze > results/service-understanding/packages.txt
          lscpu > results/service-understanding/hardware.txt
          python experiments/service-understanding/study.py --offline --output results/service-understanding-preflight
      - name: Build pinned native Blaze and AlterSchema
        run: |
          git clone https://github.com/sourcemeta/blaze.git /tmp/jh-blaze
          git -C /tmp/jh-blaze checkout 059dbed08ea26bd9a630bad5eb07421f4cc34cc0
          cmake -S experiments/hosted-sourcemeta -B experiments/hosted-sourcemeta/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBLAZE_SOURCE=/tmp/jh-blaze
          cmake --build experiments/hosted-sourcemeta/build --target jh_blaze_worker -j 4
          sha256sum "$ACLAB_BLAZE_WORKER" > results/service-understanding/native-sha256.txt
      - name: Prepare and start actual versioned One registry
        run: |
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('study','experiments/service-understanding/study.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          p=Path('infra/one/one.json');c=json.loads(p.read_text());c['url']='http://127.0.0.1:8080';p.write_text(json.dumps(c))
          for family in m.FAMILIES:
            for version in [1,2]:
              Path(f'infra/one/schemas/{family}-v{version}.json').write_text(json.dumps(m.contract(family,version)))
          PY
          docker build -t jh-service-one infra/one
          docker run -d --name jh-service-one -p 127.0.0.1:8080:8000 jh-service-one
          docker inspect jh-service-one > results/service-understanding/one-container.json
          for i in $(seq 1 60); do curl --fail --silent "$ONE_URL/self/v1/health" && break; sleep 1; done
          curl --fail "$ONE_URL/self/v1/health"
      - name: Install pinned Ollama and real model
        run: |
          curl --fail -L https://github.com/ollama/ollama/releases/download/v0.32.0/ollama-linux-amd64.tar.zst -o /tmp/ollama.tar.zst
          curl --fail -L https://github.com/ollama/ollama/releases/download/v0.32.0/sha256sum.txt -o /tmp/ollama-sha256sum.txt
          awk '$2 ~ /ollama-linux-amd64.tar.zst$/ {print $1 "  /tmp/ollama.tar.zst"}' /tmp/ollama-sha256sum.txt | sha256sum -c -
          mkdir -p /tmp/jh-ollama
          tar --zstd -xf /tmp/ollama.tar.zst -C /tmp/jh-ollama
          /tmp/jh-ollama/bin/ollama serve > results/service-understanding/ollama.log 2>&1 &
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:11434/api/version && break; sleep 1; done
          /tmp/jh-ollama/bin/ollama pull '${{ matrix.model }}'
      - name: Matched real-model experiment
        run: python experiments/service-understanding/study.py --model '${{ matrix.model }}' --tasks 24 --repeats 5 --output results/service-understanding
      - name: Live client version and outage recovery checks
        if: always()
        run: python experiments/service-understanding/registry_probes.py
      - name: Preserve complete or partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-understanding-${{ matrix.label }}
          path: results/service-understanding*
          retention-days: 30
  report:
    if: always()
    needs: study
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: service-understanding-*
          path: combined-evidence
      - name: Compare observed evidence
        run: python3 experiments/service-understanding/compare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-understanding-comparison
          path: results/service-understanding-comparison
          retention-days: 30
