name: Saved model bodies live One audit
on:
  push:
    branches: ['experiment/service-one-evaluation-20261001']
    paths: ['experiments/service-understanding/one_replay.py', '.github/workflows/service-understanding-one-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  one:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare actual One registry
        run: |
          pip install -e .
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          s=importlib.util.spec_from_file_location('study','experiments/service-understanding/study.py');m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          p=Path('infra/one/one.json');c=json.loads(p.read_text());c['url']='http://127.0.0.1:8080';p.write_text(json.dumps(c))
          for family in m.FAMILIES:
            Path(f'infra/one/schemas/{family}-v2.json').write_text(json.dumps(m.contract(family)))
          PY
          docker build -t jh-one-replay infra/one
          docker run -d --name jh-one-replay -p 127.0.0.1:8080:8000 jh-one-replay
          mkdir -p results/service-understanding-one-replay
          docker inspect jh-one-replay > results/service-understanding-one-replay/one-container.json
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:8080/self/v1/health && break; sleep 1; done
          curl --fail http://127.0.0.1:8080/self/v1/health
      - name: Wait for twelve source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          expected={f'service-understanding-{m}-shard-{s}' for m in ['qwen','gemma'] for s in range(6)}
          url='https://api.github.com/repos/HarshPopat23/JH-Reliability/actions/runs/36907463064/artifacts?per_page=100'
          for _ in range(120):
            request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(request) as response:data=json.load(response)
            names={a['name'] for a in data['artifacts'] if not a['expired']}
            if expected<=names:break
            print(f'Waiting for source artifacts: {len(expected&names)}/12',flush=True);time.sleep(30)
          else:raise RuntimeError('Source artifact wait timed out')
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: service-understanding-*-shard-*
          run-id: 36907463064
          github-token: ${{ github.token }}
          path: combined-evidence
      - name: Actual HTTP evaluation and diagnostics
        run: python experiments/service-understanding/one_replay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-understanding-live-one-replay
          path: results/service-understanding-one-replay
          retention-days: 30
