name: Real Sourcemeta and Qwen pilot
on:
  push:
    branches: ['experiment/full-rerun-sourcemeta-qwen']
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: real-sourcemeta-qwen
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: /home/runner/ollama-models
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare real pinned dependencies
        run: |
          mkdir -p results/real-hosted
          lscpu > results/real-hosted/lscpu.txt
          free -h > results/real-hosted/memory.txt
          df -h > results/real-hosted/disk.txt
          pip install -e '.[dev]'
          git clone https://github.com/sourcemeta/blaze.git /tmp/jh-blaze
          git -C /tmp/jh-blaze checkout 059dbed08ea26bd9a630bad5eb07421f4cc34cc0
          git clone https://github.com/sourcemeta/jsonbinpack.git /tmp/jh-binpack
          git -C /tmp/jh-binpack checkout 9c6be797ea4f2a586deff6f871506e7f729f3e8e
          git -C /tmp/jh-blaze rev-parse HEAD > results/real-hosted/blaze-commit.txt
          git -C /tmp/jh-binpack rev-parse HEAD > results/real-hosted/binpack-commit.txt
          pip freeze > results/real-hosted/python-packages.txt
          g++ --version > results/real-hosted/compiler.txt
      - name: Compile genuine native engines
        run: |
          cmake -S experiments/hosted-sourcemeta -B experiments/hosted-sourcemeta/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBLAZE_SOURCE=/tmp/jh-blaze -DBINPACK_SOURCE=/tmp/jh-binpack 2>&1 | tee results/real-hosted/cmake.log
          cmake --build experiments/hosted-sourcemeta/build --target jh_blaze_worker -j 4 2>&1 | tee results/real-hosted/build.log
          cmake -S experiments/hosted-sourcemeta/binpack-build -B experiments/hosted-sourcemeta/bp-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBINPACK_SOURCE=/tmp/jh-binpack -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/experiments/hosted-sourcemeta/build/bin" 2>&1 | tee results/real-hosted/binpack-cmake.log
          cmake --build experiments/hosted-sourcemeta/bp-build --target jh_binpack -j 4 2>&1 | tee results/real-hosted/binpack-build.log
          sha256sum experiments/hosted-sourcemeta/build/bin/jh_* > results/real-hosted/native-sha256.txt
      - name: Start actual One
        continue-on-error: true
        run: |
          python - <<'PYONE'
          import json
          from pathlib import Path
          p=Path('infra/one/one.json'); c=json.loads(p.read_text()); c['url']='http://127.0.0.1:8080'; p.write_text(json.dumps(c))
          PYONE
          docker build -t jh-one infra/one 2>&1 | tee results/real-hosted/one-build.log
          docker run -d --name jh-one -p 127.0.0.1:8080:8000 jh-one
          docker inspect jh-one > results/real-hosted/one-container.json
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:8080/self/v1/health && break; sleep 1; done
          curl --fail http://127.0.0.1:8080/self/v1/health
      - name: Install actual Ollama and pull Qwen
        continue-on-error: true
        run: |
          curl --fail -L https://github.com/ollama/ollama/releases/download/v0.32.0/ollama-linux-amd64.tar.zst -o /tmp/ollama.tar.zst
          curl --fail -L https://github.com/ollama/ollama/releases/download/v0.32.0/sha256sum.txt -o /tmp/ollama-sha256sum.txt
          awk '$2 ~ /ollama-linux-amd64.tar.zst$/ {print $1 "  /tmp/ollama.tar.zst"}' /tmp/ollama-sha256sum.txt | sha256sum -c -
          mkdir -p /tmp/jh-ollama
          tar --zstd -xf /tmp/ollama.tar.zst -C /tmp/jh-ollama
          /tmp/jh-ollama/bin/ollama serve > results/real-hosted/ollama-server.log 2>&1 &
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:11434/api/version && break; sleep 1; done
          /tmp/jh-ollama/bin/ollama pull qwen3:4b-instruct 2>&1 | tee results/real-hosted/ollama-pull.log
          /tmp/jh-ollama/bin/ollama --version > results/real-hosted/ollama-version.txt
      - name: Existing unit and integration checks
        run: pytest -q
      - name: Execute native, registry, storage and real inference studies
        run: python experiments/hosted-sourcemeta/run.py 2>&1 | tee results/real-hosted/experiment.log
      - name: Generate evidence-only report
        if: always()
        run: python experiments/hosted-sourcemeta/report.py
      - name: Preserve partial or complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-sourcemeta-qwen-evidence
          path: results/real-hosted
          retention-days: 7
      - name: Publish honest stage status
        if: always()
        run: |
          echo '## Real Sourcemeta / Qwen execution' >> "$GITHUB_STEP_SUMMARY"
          if test -f results/real-hosted/manifest.json; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat results/real-hosted/manifest.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Setup did not reach measurements. Inspect uploaded logs; no performance claims are available.' >> "$GITHUB_STEP_SUMMARY"
          fi
